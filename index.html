<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<title>Lăpușneanul · Bac</title>
<style>
:root {
  --bg: #f3e8d2;
  --bg2: #ecdfc3;
  --surface: #fbf6ea;
  --ink: #2b1d14;
  --muted: #6e5a46;
  --accent: #7a1f2b;
  --accent-ink: #fff8ec;
  --gold: #a87a26;
  --gold-soft: #e9d6a6;
  --line: #d9c49b;
  --ok: #2f6b3a;
  --ok-bg: #e3efd9;
  --bad: #a3262f;
  --bad-bg: #f6dcd8;
  --shadow: 0 1px 2px rgba(60,35,15,.08), 0 6px 18px rgba(60,35,15,.10);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1a1311;
  --bg2: #221916;
  --surface: #2a1f1b;
  --ink: #f0e5cf;
  --muted: #bba88c;
  --accent: #d36b7d;
  --accent-ink: #1a1311;
  --gold: #d9ae5a;
  --gold-soft: #4a3a22;
  --line: #45352d;
  --ok: #86c994;
  --ok-bg: #1f3324;
  --bad: #f08890;
  --bad-bg: #3d1f22;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse at top, var(--bg2), transparent 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(32px + env(safe-area-inset-bottom)); }

/* Header */
.top { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.top h1 { font-family: var(--serif); font-size: 1.15rem; margin: 0; flex: 1; font-weight: 600; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 1.15rem; flex: none; }
.icon-btn:active { transform: scale(.96); }

.hero { text-align: center; padding: 18px 8px 6px; }
.hero .orn { color: var(--gold); font-size: 1.2rem; letter-spacing: .6em; }
.hero h2 { font-family: var(--serif); font-size: clamp(1.7rem, 6vw, 2.3rem); line-height: 1.15; margin: 6px 0 4px; color: var(--accent); font-weight: 700; }
.hero p { margin: 0; color: var(--muted); font-family: var(--serif); font-style: italic; }

.section-title { font-family: var(--serif); font-size: 1.05rem; color: var(--muted); margin: 22px 2px 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

/* Modes */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mode { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 6px; text-align: center; cursor: pointer; box-shadow: var(--shadow); min-height: 92px; }
.mode .g { display: block; font-size: 1.6rem; color: var(--gold); line-height: 1.2; font-family: var(--serif); }
.mode .t { display: block; font-weight: 600; margin-top: 4px; font-size: .95rem; }
.mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.mode[aria-pressed="true"] .g { color: var(--gold-soft); }
:root[data-theme="dark"] .mode[aria-pressed="true"] .g { color: var(--accent-ink); }

/* Categories */
.cats { display: grid; gap: 10px; }
.cat { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.cat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.cat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cat-name { font-weight: 600; }
.cat-meta { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.bar { height: 6px; border-radius: 6px; background: var(--bg2); margin-top: 8px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 6px; transition: width .4s; }

.opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 10px 16px; cursor: pointer; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toggle { display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; min-height: 44px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: .9rem; font-weight: 500; }
.start { margin-top: 22px; font-size: 1.1rem; }
.foot { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 26px; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px; font-size: .85rem; }

/* Flashcards */
.counter { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; margin: 6px 2px 10px; gap: 8px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--ink); font-size: .8rem; }
.stage { position: relative; perspective: 1400px; height: clamp(340px, 58vh, 480px); margin-bottom: 14px; }
.swipe { position: absolute; inset: 0; touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none; }
.swipe.anim { transition: transform .3s ease, opacity .3s ease; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.7,.3,1); }
.flip.on { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); padding: 22px 22px 18px; display: flex; flex-direction: column; overflow: auto; }
.face::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--gold-soft); border-radius: 16px; pointer-events: none; }
.face.back { transform: rotateY(180deg); }
.face .lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); font-weight: 700; }
.face .main { flex: 1; display: flex; flex-direction: column; justify-content: center; font-family: var(--serif); }
.face.front .main { font-size: clamp(1.25rem, 4.8vw, 1.55rem); line-height: 1.35; text-align: center; }
.face.back .main { font-size: clamp(1.05rem, 4vw, 1.25rem); line-height: 1.45; }
.face .ctx { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .92rem; }
.face .hint { text-align: center; color: var(--muted); font-size: .8rem; }
.stamp { position: absolute; top: 18px; padding: 4px 12px; border: 3px solid; border-radius: 10px; font-weight: 800; font-size: 1.1rem; opacity: 0; transform: rotate(-12deg); pointer-events: none; z-index: 3; background: var(--surface); }
.stamp.yes { right: 18px; color: var(--ok); border-color: var(--ok); transform: rotate(12deg); }
.stamp.no { left: 18px; color: var(--bad); border-color: var(--bad); }
.fc-actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.btn.no { border-color: var(--bad); color: var(--bad); }
.btn.yes { border-color: var(--ok); background: var(--ok); color: #fff; }
:root[data-theme="dark"] .btn.yes { color: #10200f; }
.kbd-hint { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }
@media (hover: none) { .kbd-hint { display: none; } }

/* Quiz */
.qtype { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); font-weight: 700; }
.qtext { font-family: var(--serif); font-size: clamp(1.2rem, 4.6vw, 1.45rem); line-height: 1.35; margin: 6px 0 16px; }
.progress-line { height: 5px; background: var(--bg2); border-radius: 5px; overflow: hidden; margin-bottom: 14px; border: 1px solid var(--line); }
.progress-line > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; min-height: 54px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.choice .k { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: .85rem; color: var(--muted); }
.choice.correct { border-color: var(--ok); background: var(--ok-bg); }
.choice.correct .k { background: var(--ok); color: #fff; border-color: var(--ok); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice.wrong .k { background: var(--bad); color: #fff; border-color: var(--bad); }
.choice:disabled { cursor: default; }
.tf { grid-template-columns: 1fr 1fr; }
.tf .choice { justify-content: center; font-weight: 700; font-size: 1.05rem; min-height: 64px; }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.order li { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 6px 6px 6px 4px; min-height: 56px; }
.order li.dragging { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.18); transform: scale(1.02); position: relative; z-index: 2; }
.order .handle { touch-action: none; cursor: grab; width: 40px; align-self: stretch; display: grid; place-items: center; color: var(--muted); font-size: 1.3rem; flex: none; border-radius: 10px; }
.order .handle:active { cursor: grabbing; }
.order .num { font-weight: 700; color: var(--gold); width: 20px; flex: none; text-align: center; }
.order .txt { flex: 1; font-size: .97rem; line-height: 1.3; }
.order .mv { display: flex; flex-direction: column; gap: 4px; flex: none; }
.order .mv button { width: 40px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); cursor: pointer; font-size: .8rem; }
.order .mv button:disabled { opacity: .3; }
.order li.correct { border-color: var(--ok); background: var(--ok-bg); }
.order li.wrong { border-color: var(--bad); background: var(--bad-bg); }

.match-help { color: var(--muted); font-size: .88rem; margin: -6px 0 12px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .match { grid-template-columns: 1fr; } .match .col + .col { margin-top: 6px; } }
.match .col { display: grid; gap: 8px; align-content: start; }
.match .colh { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.mi { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 48px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: .95rem; line-height: 1.3; }
.mi .b { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
.mi.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.mi.paired .b { border-style: solid; color: #fff; }
.mi.left { font-family: var(--serif); }
.mi.correct { border-color: var(--ok); background: var(--ok-bg); }
.mi.wrong { border-color: var(--bad); background: var(--bad-bg); }
.mi .fix { display: block; font-size: .82rem; color: var(--ok); margin-top: 4px; font-family: var(--sans); }
.c0{background:#7a1f2b!important;border-color:#7a1f2b!important}.c1{background:#a87a26!important;border-color:#a87a26!important}.c2{background:#2f5d7a!important;border-color:#2f5d7a!important}.c3{background:#4f6b2f!important;border-color:#4f6b2f!important}.c4{background:#6b3f7a!important;border-color:#6b3f7a!important}.c5{background:#7a5a2f!important;border-color:#7a5a2f!important}

.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid; animation: pop .25s ease; }
.feedback.ok { border-color: var(--ok); background: var(--ok-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback strong { display: block; font-size: 1.05rem; margin-bottom: 2px; }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--bad); }
.feedback .corr { margin-top: 6px; font-size: .92rem; }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.qactions { margin-top: 16px; }

.result { text-align: center; padding: 10px 0 4px; }
.score-ring { width: 150px; height: 150px; margin: 8px auto 6px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg2) 0); }
.score-ring > div { width: 118px; height: 118px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--serif); font-size: 2rem; font-weight: 700; color: var(--accent); }
.result h2 { font-family: var(--serif); margin: 8px 0 4px; }
.result p { color: var(--muted); margin: 0; }
.mistakes { display: grid; gap: 10px; margin-top: 8px; }
.mistake { background: var(--surface); border: 1.5px solid var(--line); border-left: 4px solid var(--bad); border-radius: 12px; padding: 12px 14px; }
.mistake .mq { font-family: var(--serif); font-weight: 600; margin-bottom: 6px; }
.mistake .ma { font-size: .9rem; }
.mistake .ma .y { color: var(--bad); }
.mistake .ma .c { color: var(--ok); }
.mistake .me { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.actions-col { display: grid; gap: 10px; margin-top: 20px; }

/* Recap */
.recap details { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.recap summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 16px; font-family: var(--serif); font-weight: 600; font-size: 1.05rem; position: relative; min-height: 52px; }
.recap summary::-webkit-details-marker { display: none; }
.recap summary::after { content: "+"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 1.4rem; font-family: var(--sans); transition: transform .2s; }
.recap details[open] summary::after { content: "−"; }
.recap details[open] summary { border-bottom: 1px dashed var(--line); }
.recap .sec { color: var(--gold); margin-right: 6px; }
.recap ul { margin: 0; padding: 12px 16px 14px 34px; }
.recap li { margin: 6px 0; }
.recap .ctrl { display: flex; gap: 8px; justify-content: flex-end; margin: -2px 0 10px; }
.chap { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.chap h3 { font-family: var(--serif); margin: 0 0 10px; color: var(--accent); font-size: 1.2rem; }
.motto { font-family: var(--serif); font-style: italic; font-size: 1.12rem; background: var(--gold-soft); border-left: 4px solid var(--gold); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 0 0 12px; }
.chap p { margin: 0 0 8px; font-family: var(--serif); font-size: 1.02rem; line-height: 1.55; }
.chap p:first-of-type::first-letter { font-size: 2.6em; float: left; line-height: .85; padding: 4px 8px 0 0; color: var(--accent); font-weight: 700; }
.note { border: 1.5px dashed var(--gold); border-radius: 14px; padding: 12px 14px; background: var(--surface); font-size: .95rem; }
.note b { color: var(--accent); }
.q { font-family: var(--serif); font-style: italic; }
.done-box { text-align: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 28px 18px; box-shadow: var(--shadow); }
.done-box .orn { color: var(--gold); font-size: 2rem; }
.done-box h2 { font-family: var(--serif); color: var(--accent); margin: 6px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .flip, .swipe.anim, .bar > i { transition: none !important; } .feedback { animation: none; } }
</style>
</head>
